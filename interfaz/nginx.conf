server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 add_header X-Content-Type-Options nosniff;
 add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
 location = /app.js { add_header Cache-Control "no-store"; }
 location / { try_files $uri $uri/ /index.html; }
 location /api/ { proxy_pass http://api:8000/; proxy_read_timeout 120s; }
 location /salud { return 200 'ok'; add_header Content-Type text/plain; }
}
